# Weekly upkeep check for the free Help tools: every link they cite (hospital
# policies, statutes, offices) still answers, and the AG's rent-cap page still
# shows the cap the site uses. On failure it opens (or comments on) an issue.
name: Help tools link check

on:
  schedule:
    - cron: "23 15 * * 2" # Tuesdays, mid-morning Pacific
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test runner
        working-directory: e2e
        run: npm ci
      - name: Check links
        id: check
        working-directory: e2e
        run: LINKS=1 npx playwright test tests/help-links.spec.ts --reporter=line 2>&1 | tee ../links.log
        continue-on-error: true
      - name: Open an issue if anything broke
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Help tools: broken links or outdated rent cap"
          body="$(printf 'The weekly Help tools check failed (run %s).\n\n```\n%s\n```' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(tail -c 60000 links.log)")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          exit 1
