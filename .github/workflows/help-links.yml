# Weekly upkeep check for the free Help tools: every link they cite (hospital
# policies, statutes, offices) still answers, the AG's rent-cap page still
# shows the cap the site uses, and no dated fact (rent cap, poverty line,
# minimum wage, benefit limits, court holidays…) comes due in the next 45 days
# (frontend/src/help/upkeep.ts). On failure a separate job, which holds the
# only token that can write, opens or updates an issue.
name: Help tools link check

on:
  schedule:
    - cron: "23 15 * * 2" # Tuesdays, mid-morning Pacific
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    outputs:
      failed: ${{ steps.check.outcome == 'failure' }}
      upkeep: ${{ steps.upkeep.outcome == 'failure' }}
      overdue: ${{ steps.overdue.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test runner
        working-directory: e2e
        # The check only uses HTTP requests: no browsers, no install scripts.
        run: npm ci --ignore-scripts
      - name: Check links
        id: check
        working-directory: e2e
        shell: bash # -eo pipefail: a failing test fails the step despite tee
        run: LINKS=1 npx playwright test tests/help-links.spec.ts --reporter=line 2>&1 | tee ../links.log
        continue-on-error: true
      - name: Facts coming due in the next 45 days
        id: upkeep
        working-directory: e2e
        shell: bash
        run: UPKEEP_WINDOW=45 npx playwright test tests/unit-upkeep.spec.ts --reporter=line 2>&1 | tee ../upkeep.log
        continue-on-error: true
      # Same test without the window: fails only when a fact is already out of date.
      - name: Facts already out of date
        id: overdue
        if: steps.upkeep.outcome == 'failure'
        working-directory: e2e
        run: npx playwright test tests/unit-upkeep.spec.ts --reporter=line
        continue-on-error: true
      - if: steps.check.outcome == 'failure' || steps.upkeep.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: links-log
          path: |
            links.log
            upkeep.log

  report:
    needs: links
    if: needs.links.outputs.failed == 'true' || needs.links.outputs.upkeep == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: links-log
      - name: Open or update the links issue
        if: needs.links.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Help tools: broken links or outdated rent cap"
          # Keep only the test's own summary lines; never paste fetched pages.
          summary="$(grep -E '^\s*(Broken links|[0-9]{3} https://|no answer https://|Blocked|oag\.ca\.gov)' links.log | tr -d '`' | head -100)"
          body="$(printf 'The weekly Help tools check failed: %s\n\n~~~\n%s\n~~~\n' "$RUN_URL" "$summary")"
          # Only the bot's own issue with exactly this title (anyone can open issues).
          existing="$(gh issue list --state open --app github-actions --search "$title in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Open or update the upkeep issue
        if: needs.links.outputs.upkeep == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Help tools: facts to update soon"
          # Only the test's own UPKEEP lines (built from the repo's facts files).
          list="$(grep -E '^UPKEEP [0-9]{4}-[0-9]{2}-[0-9]{2} ' upkeep.log | sed -E 's/^UPKEEP /- [ ] /' | tr -d '`' | sort -u | head -50)"
          [ -n "$list" ] || list="(the upkeep test failed without a list: see the run log)"
          body="$(printf 'These Help tool facts are due (date = first day they are out of date). Each line says what to update; the tests in e2e/tests/unit-*.spec.ts fail once a date passes.\n\n%s\n\nLast checked: %s\n' "$list" "$RUN_URL")"
          existing="$(gh issue list --state open --app github-actions --search "$title in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            # The body is kept current each week; a comment (which notifies) only
            # when the list itself changed. Close the issue by hand when done.
            before="$(gh issue view "$existing" --json body --jq .body | grep -E '^- \[.\] [0-9]{4}-' | sed -E 's/^- \[.\] //' || true)"
            after="$(printf '%s\n' "$list" | sed -E 's/^- \[.\] //')"
            gh issue edit "$existing" --body "$body"
            if [ "$before" != "$after" ]; then gh issue comment "$existing" --body "$(printf 'The list changed:\n\n%s\n' "$list")"; fi
          fi
      - name: Fail the run when links broke or a fact is out of date
        if: needs.links.outputs.failed == 'true' || needs.links.outputs.overdue == 'true'
        run: exit 1
