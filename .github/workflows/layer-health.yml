# Weekly health report for the ~2,000 state layers (backend/scripts/layer_health.py):
# each one's ArcGIS service still answers the map's own sample query, still has
# the fields we show, still has features where it used to, and (for data that
# should change) was edited in the last ~3 years. Report only: nothing on the
# map changes. A separate job, which holds the only token that can write, keeps
# ONE issue current ("Layer health: N layers need attention") and closes it when
# nothing needs attention. A broken or empty layer is listed only after two
# runs in a row (last week's report is read from the previous run's artifact).
name: Layer health check

on:
  schedule:
    - cron: "41 14 * * 3" # Wednesdays, early morning Pacific
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so two runs never open two issues.
concurrency:
  group: layer-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # download last run's report
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      - name: Last run's report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id="$(gh run list --workflow layer-health.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$id" ]; then gh run download "$id" --name layer-health --dir previous || true; fi
      - name: Check every state layer
        working-directory: backend
        run: |
          prev=()
          [ -f ../previous/layer-health.json ] && prev=(--previous ../previous/layer-health.json)
          uv run --locked python scripts/layer_health.py --out ../health "${prev[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer-health
          path: |
            health/layer-health.json
            health/layer-health.md
          retention-days: 90

  report:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: layer-health
      - name: Open, update or close the layer health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n="$(jq -r '.attention' layer-health.json)"
          if [ "$n" = 1 ]; then title="Layer health: 1 layer needs attention"
          else title="Layer health: $n layers need attention"; fi
          # Only the bot's own issue (anyone can open issues); its title changes with N.
          existing="$(gh issue list --state open --app github-actions --search "Layer health in:title" \
            --json number,title --jq 'map(select(.title | startswith("Layer health: "))) | .[0].number // empty')"
          if [ "$n" = 0 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Every state layer is ok again: $RUN_URL"
            fi
            exit 0
          fi
          { cat layer-health.md; printf '\nLast checked: %s (full report: the layer-health artifact)\n' "$RUN_URL"; } > body.md
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file body.md
          else
            # The body is kept current each week; a comment (which notifies) only
            # when the count changed.
            before="$(gh issue view "$existing" --json title --jq .title)"
            gh issue edit "$existing" --title "$title" --body-file body.md
            if [ "$before" != "$title" ]; then gh issue comment "$existing" --body "Now: $title. $RUN_URL"; fi
          fi
