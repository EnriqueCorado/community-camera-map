# Builds the static site (pre-baked data in frontend/public/data, no backend)
# and publishes it to GitHub Pages on every push to main — and every 15 minutes,
# refreshing the live, keyless layers (flights, fires, quakes, …) first so the
# public site stays current without a server. Hourly runs also refresh the
# heavier layers (haze index, webcam lists). Nothing is committed back.
# Actions are pinned to commit SHAs (tag noted alongside) for supply-chain safety.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *" # fast live layers (flights, fires, quakes, …)
    - cron: "7 * * * *" # hourly: + haze index and webcam lists (its own cron, so a
    #                       delayed fast run can never skip it)
    - cron: "37 11 * * *" # daily: OpenStreetMap places (Overpass servers rate-limit)
    - cron: "12 20 * * *" # daily history snapshot (around midday Pacific)
    - cron: "41 9 * * 1" # weekly (Mondays): nationwide service lists (DOJ, ICE, HHS, DOL)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Queue rather than cancel: a scheduled refresh must not kill a push deploy.
  cancel-in-progress: false

jobs:
  # Isolated job: the only place the Windy key exists. Fresh runner, no
  # third-party image decoding; it hands back nothing but the GeoJSON file.
  windy:
    if: github.event_name != 'schedule' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      - name: Refresh Windy webcams
        working-directory: backend
        env:
          # Optional; the Windy layer stays "needs API key" without it.
          CAM_WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: uv run --locked python scripts/refresh_live.py --only windy-webcams
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windy-webcams
          path: frontend/public/data/layers/windy-webcams.geojson
          if-no-files-found: ignore
          retention-days: 1

  # Isolated job, like windy: the only place the Iteris 511 / OHGO keys exist.
  # Rebuilds the camera list from every camera source (Caltrans, keyless state
  # DOTs, USGS, NOAA, and the keyed 511 states) and the road-operations layers
  # (work zones, incidents, message signs, road weather: keyless feeds + the
  # keyed 511 / OHGO ones), and hands back just those files as data: the camera
  # folder (frontend/public/data/cameras/: index, search file and grid cells, see
  # backend/app/cameras/static_split.py) and the road GeoJSON. bake.py's
  # check_camera_list guards (Caltrans present, no big shrink, no key in any URL)
  # run before the camera list is written.
  # Hourly at most: Iteris allows 10 calls / 60 s per key and we make three per
  # state per run. A missing or not-yet-approved key just skips that state.
  cameras:
    if: github.event_name != 'schedule' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      - name: Bake the camera list
        working-directory: backend
        env:
          CAM_ITERIS_KEY_GA: ${{ secrets.ITERIS_KEY_GA }}
          CAM_ITERIS_KEY_WI: ${{ secrets.ITERIS_KEY_WI }}
          CAM_ITERIS_KEY_NV: ${{ secrets.ITERIS_KEY_NV }}
          CAM_ITERIS_KEY_NC: ${{ secrets.ITERIS_KEY_NC }}
          CAM_ITERIS_KEY_UT: ${{ secrets.ITERIS_KEY_UT }}
          CAM_ITERIS_KEY_AK: ${{ secrets.ITERIS_KEY_AK }}
          CAM_ITERIS_KEY_LA: ${{ secrets.ITERIS_KEY_LA }}
          CAM_ITERIS_KEY_ID: ${{ secrets.ITERIS_KEY_ID }}
          CAM_ITERIS_KEY_AZ: ${{ secrets.ITERIS_KEY_AZ }}
          CAM_OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}
        run: uv run --locked python scripts/bake.py --cameras-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cameras
          path: frontend/public/data/cameras/
          if-no-files-found: error
          retention-days: 1
      # Road operations (scripts/refresh_live.py KEYED). The committed copies are
      # removed first, so only freshly baked files are handed back (a layer whose
      # every source failed keeps the build job's cached copy instead).
      - name: Bake road-operations layers
        working-directory: backend
        continue-on-error: true # a slow state feed must not cost the camera list
        timeout-minutes: 10
        env:
          CAM_ITERIS_KEY_GA: ${{ secrets.ITERIS_KEY_GA }}
          CAM_ITERIS_KEY_WI: ${{ secrets.ITERIS_KEY_WI }}
          CAM_ITERIS_KEY_NV: ${{ secrets.ITERIS_KEY_NV }}
          CAM_ITERIS_KEY_NC: ${{ secrets.ITERIS_KEY_NC }}
          CAM_ITERIS_KEY_UT: ${{ secrets.ITERIS_KEY_UT }}
          CAM_ITERIS_KEY_AK: ${{ secrets.ITERIS_KEY_AK }}
          CAM_ITERIS_KEY_LA: ${{ secrets.ITERIS_KEY_LA }}
          CAM_ITERIS_KEY_ID: ${{ secrets.ITERIS_KEY_ID }}
          CAM_ITERIS_KEY_AZ: ${{ secrets.ITERIS_KEY_AZ }}
          CAM_OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}
        run: |
          rm -f ../frontend/public/data/layers/{work-zones,road-incidents,message-signs-usa,road-weather-usa}.geojson
          uv run --locked python scripts/refresh_live.py --keyed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: road-ops
          path: |
            frontend/public/data/layers/work-zones.geojson
            frontend/public/data/layers/road-incidents.geojson
            frontend/public/data/layers/message-signs-usa.geojson
            frontend/public/data/layers/road-weather-usa.geojson
          if-no-files-found: ignore
          retention-days: 1

  # Daily snapshot of the fast-changing layers (quakes, fires, smoke, outages,
  # alerts) for the map's History slider. Two jobs, so the one that can write
  # to the repo never runs project code or dependencies:
  #  - history: read-only; fetches the layers, hands back plain GeoJSON files
  #  - history-push: commits those files to the `history` data branch
  history:
    if: github.event.schedule == '12 20 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: history
          path: history-data
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      - name: Snapshot today's layers
        working-directory: backend
        run: uv run --locked python scripts/snapshot_history.py ../history-data
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: history-data
          path: |
            history-data/
            !history-data/.git/
          retention-days: 1

  history-push:
    needs: history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: history
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: history-data
          path: incoming
      - name: Commit to the history branch (data files only)
        run: |
          # Never sync an empty/broken snapshot (--delete would wipe the branch).
          test -s incoming/index.json || { echo "no index.json in the snapshot"; exit 1; }
          # Only dated GeoJSON folders and the index: nothing executable.
          find incoming -type f ! -name '*.geojson' ! -path 'incoming/index.json' ! -name README.md -delete
          rsync -a --delete --exclude .git --exclude incoming --exclude README.md incoming/ ./
          rm -rf incoming
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "History snapshot $(date -u +%F)"
          git push -q origin HEAD:history

  build:
    needs: [windy, cameras, history-push]
    # Run even when the windy/history jobs are skipped (most runs) or fail.
    if: ${{ !cancelled() && needs.windy.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      # Hourly layers and the daily OpenStreetMap places aren't refreshed on
      # every run; carry the latest copies into every deploy (nothing is
      # committed back to git).
      - name: Restore hourly/daily layers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/public/data/alpr
            frontend/public/data/layers/reservoirs.geojson
            frontend/public/data/layers/fire-weather.geojson
            frontend/public/data/layers/volcanoes.geojson
            frontend/public/data/layers/drought.geojson
            frontend/public/data/layers/voting.geojson
            frontend/public/data/layers/wastewater.geojson
            frontend/public/data/layers/groundwater.geojson
            frontend/public/data/layers/housing-proposals.geojson
            frontend/public/data/layers/new-homes.geojson
            frontend/public/data/layers/ceqa-projects.geojson
            frontend/public/data/layers/fire-cameras.geojson
            frontend/public/data/layers/smoke-haze.geojson
            frontend/public/data/layers/river-cameras.geojson
            frontend/public/data/layers/fire-hotspots.geojson
            frontend/public/data/layers/wildfire-perimeters.geojson
            frontend/public/data/layers/aed.geojson
            frontend/public/data/layers/drinking-water.geojson
            frontend/public/data/layers/restrooms.geojson
            frontend/public/data/layers/ev-chargers.geojson
            frontend/public/data/layers/libraries.geojson
            frontend/public/data/layers/playgrounds.geojson
            frontend/public/data/layers/pharmacies.geojson
            frontend/public/data/layers/fire-stations.geojson
            frontend/public/data/layers/free-wifi.geojson
            frontend/public/data/layers/food-banks.geojson
            frontend/public/data/layers/clinics.geojson
            frontend/public/data/layers/community-centers.geojson
            frontend/public/data/layers/farmers-markets.geojson
            frontend/public/data/layers/ar-burn-bans.geojson
            frontend/public/data/layers/reservoirs-usa.geojson
            frontend/public/data/layers/groundwater-usa.geojson
          key: live-data-v2-${{ github.run_id }}
          restore-keys: live-data-v2-
      # The camera list is cached on its own (adding it to the list above would
      # change that cache's version and drop every saved hourly layer once).
      # It's a folder that must stay whole (one bake), so the cached and fresh
      # copies land beside it and replace it in one step.
      - name: Restore camera list
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: camera-cache
          key: cameras-v2-${{ github.run_id }}
          restore-keys: cameras-v2-
      # This run's camera list, when the cameras job made one (hourly / push);
      # otherwise the cached hourly copy (or the committed folder) is used.
      - name: Fetch camera list
        id: cameras-dl
        if: needs.cameras.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cameras
          path: camera-new
      - name: Use the newest camera list
        id: cameras-use
        run: |
          if [ -s camera-new/index.json ]; then src=camera-new
          elif [ -s camera-cache/index.json ]; then src=camera-cache
          else echo "using the committed camera list"; exit 0
          fi
          # Data files only: no links, nothing but the index, search file and cells.
          find "$src" ! -type f ! -type d -delete
          find "$src" -type f ! -path "$src/index.json" ! -path "$src/search.json" \
            ! \( -path "$src/cells/*" -name '*.json' ! -name '*[!-0-9_]*.json' \) -delete
          rm -rf frontend/public/data/cameras
          cp -R "$src" frontend/public/data/cameras
          if [ "$src" = camera-new ]; then
            rm -rf camera-cache && cp -R camera-new camera-cache
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Save camera list
        if: steps.cameras-use.outputs.fresh == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: camera-cache
          key: cameras-v2-${{ github.run_id }}
      # Road-operations layers come from the keyed cameras job (hourly / push);
      # their own cache carries them into the 15-minute runs. Without either,
      # the committed copies are used.
      - name: Restore road-operations layers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/public/data/layers/work-zones.geojson
            frontend/public/data/layers/road-incidents.geojson
            frontend/public/data/layers/message-signs-usa.geojson
            frontend/public/data/layers/road-weather-usa.geojson
          key: road-ops-v1-${{ github.run_id }}
          restore-keys: road-ops-v1-
      # Downloaded aside, so a layer missing from this run's artifact keeps its
      # cached copy (and its "updated" time) instead of being re-stamped.
      - name: Fetch road-operations layers
        id: roads-dl
        if: needs.cameras.result == 'success'
        continue-on-error: true # no artifact when every road feed failed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: road-ops
          path: road-ops-in
      - name: Adopt road-operations layers
        if: steps.roads-dl.outcome == 'success'
        working-directory: backend
        run: uv run --locked python scripts/refresh_live.py --adopt work-zones,road-incidents,message-signs-usa,road-weather-usa --from ../road-ops-in
      - name: Save road-operations layers
        if: steps.roads-dl.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/public/data/layers/work-zones.geojson
            frontend/public/data/layers/road-incidents.geojson
            frontend/public/data/layers/message-signs-usa.geojson
            frontend/public/data/layers/road-weather-usa.geojson
          key: road-ops-v1-${{ github.run_id }}
      # Weekly service lists (scripts/refresh_live.py --weekly): their own cache,
      # so the hourly/daily cache above is untouched; without a cached copy the
      # committed files are used. Bump the key (v1 -> v2) when a committed
      # fix to these files must go live before the next Monday refresh.
      - name: Restore weekly service lists
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/public/data/layers/immigration-legal-help.geojson
            frontend/public/data/layers/detention-centers.geojson
            frontend/public/data/layers/health-centers.geojson
            frontend/public/data/layers/head-start.geojson
            frontend/public/data/layers/early-head-start.geojson
            frontend/public/data/layers/job-centers.geojson
            frontend/public/data/layers/mental-health.geojson
            frontend/public/data/layers/addiction-treatment.geojson
            frontend/public/data/layers/housing-counseling.geojson
            frontend/public/data/layers/public-housing.geojson
            frontend/public/data/layers/colleges.geojson
            frontend/public/data/layers/va-facilities.geojson
            frontend/public/data/layers/building-permits.geojson
            frontend/public/data/layers/ny-child-care-centers.geojson
            frontend/public/data/layers/pa-child-care-centers.geojson
            frontend/public/data/layers/tx-child-care-centers.geojson
            frontend/public/data/layers/social-security-offices.geojson
            frontend/public/data/layers/legal-aid-areas.geojson
            frontend/public/data/layers/post-offices.geojson
          key: services-weekly-v1-${{ github.run_id }}
          restore-keys: services-weekly-v1-
      - name: Refresh live layers (fast)
        if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
        working-directory: backend
        run: uv run --locked python scripts/refresh_live.py
      - name: Refresh live layers (hourly, and on every push / manual run)
        if: github.event_name != 'schedule' || github.event.schedule == '7 * * * *'
        working-directory: backend
        run: uv run --locked python scripts/refresh_live.py --hourly
      - name: Refresh nationwide service lists (weekly; keeps the last good file on failure)
        if: github.event.schedule == '41 9 * * 1'
        working-directory: backend
        timeout-minutes: 20
        continue-on-error: true # a slow federal server must not block the deploy
        run: uv run --locked python scripts/refresh_live.py --weekly
      - name: Save weekly service lists
        if: github.event.schedule == '41 9 * * 1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/public/data/layers/immigration-legal-help.geojson
            frontend/public/data/layers/detention-centers.geojson
            frontend/public/data/layers/health-centers.geojson
            frontend/public/data/layers/head-start.geojson
            frontend/public/data/layers/early-head-start.geojson
            frontend/public/data/layers/job-centers.geojson
            frontend/public/data/layers/mental-health.geojson
            frontend/public/data/layers/addiction-treatment.geojson
            frontend/public/data/layers/housing-counseling.geojson
            frontend/public/data/layers/public-housing.geojson
            frontend/public/data/layers/colleges.geojson
            frontend/public/data/layers/va-facilities.geojson
            frontend/public/data/layers/building-permits.geojson
            frontend/public/data/layers/ny-child-care-centers.geojson
            frontend/public/data/layers/pa-child-care-centers.geojson
            frontend/public/data/layers/tx-child-care-centers.geojson
            frontend/public/data/layers/social-security-offices.geojson
            frontend/public/data/layers/legal-aid-areas.geojson
            frontend/public/data/layers/post-offices.geojson
          key: services-weekly-v1-${{ github.run_id }}
      - name: Refresh OpenStreetMap places (daily, and on manual runs)
        if: github.event.schedule == '37 11 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: backend
        run: uv run --locked python scripts/refresh_live.py --daily
      # Nationwide plate readers (OpenStreetMap via DeFlock), cut into tiles.
      # No cached copy yet: start from the seed on the alpr-data branch.
      - name: Fetch plate-reader seed
        if: hashFiles('frontend/public/data/alpr/index.json') == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          ref: alpr-data
          path: alpr-seed
          persist-credentials: false
      - name: Use plate-reader seed
        if: hashFiles('frontend/public/data/alpr/index.json') == '' && hashFiles('alpr-seed/index.json') != ''
        run: rsync -a --exclude .git --exclude README.md alpr-seed/ frontend/public/data/alpr/
      # Daily refresh: DeFlock if it lets us in, else Overpass, oldest cells first.
      - name: Refresh nationwide plate-reader tiles
        if: github.event.schedule == '37 11 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: backend
        timeout-minutes: 25 # Overpass fallback: ~134 cells, 18-minute budget
        continue-on-error: true # the California file stays as the fallback
        run: uv run --locked python scripts/build_alpr_usa.py
      - name: Save hourly/daily layers
        if: github.event_name != 'schedule' || github.event.schedule != '*/15 * * * *'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/public/data/alpr
            frontend/public/data/layers/reservoirs.geojson
            frontend/public/data/layers/fire-weather.geojson
            frontend/public/data/layers/volcanoes.geojson
            frontend/public/data/layers/drought.geojson
            frontend/public/data/layers/voting.geojson
            frontend/public/data/layers/wastewater.geojson
            frontend/public/data/layers/groundwater.geojson
            frontend/public/data/layers/housing-proposals.geojson
            frontend/public/data/layers/new-homes.geojson
            frontend/public/data/layers/ceqa-projects.geojson
            frontend/public/data/layers/fire-cameras.geojson
            frontend/public/data/layers/smoke-haze.geojson
            frontend/public/data/layers/river-cameras.geojson
            frontend/public/data/layers/fire-hotspots.geojson
            frontend/public/data/layers/wildfire-perimeters.geojson
            frontend/public/data/layers/aed.geojson
            frontend/public/data/layers/drinking-water.geojson
            frontend/public/data/layers/restrooms.geojson
            frontend/public/data/layers/ev-chargers.geojson
            frontend/public/data/layers/libraries.geojson
            frontend/public/data/layers/playgrounds.geojson
            frontend/public/data/layers/pharmacies.geojson
            frontend/public/data/layers/fire-stations.geojson
            frontend/public/data/layers/free-wifi.geojson
            frontend/public/data/layers/food-banks.geojson
            frontend/public/data/layers/clinics.geojson
            frontend/public/data/layers/community-centers.geojson
            frontend/public/data/layers/farmers-markets.geojson
            frontend/public/data/layers/ar-burn-bans.geojson
            frontend/public/data/layers/reservoirs-usa.geojson
            frontend/public/data/layers/groundwater-usa.geojson
          key: live-data-v2-${{ github.run_id }}
      - name: Fetch Windy list (if the windy job produced one)
        if: needs.windy.result == 'success'
        continue-on-error: true # no artifact when no key is configured
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windy-webcams
          path: frontend/public/data/layers
      - name: Adopt Windy list
        if: needs.windy.result == 'success'
        working-directory: backend
        run: uv run --locked python scripts/refresh_live.py --adopt windy-webcams
      # Saved days for the History slider (read-only checkout of the data branch).
      - name: Fetch history snapshots
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          ref: history
          path: history-data
          persist-credentials: false
      - name: Add history to the site
        run: |
          mkdir -p frontend/public/data/history
          if [ -f history-data/index.json ]; then
            rsync -a --exclude .git --exclude README.md history-data/ frontend/public/data/history/
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build (static mode)
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /community-camera-map/
          # Real-time flights relay (relay/, a Vercel Function). Empty = the
          # site falls back to the 15-minute flights snapshot.
          VITE_FLIGHTS_URL: ${{ vars.FLIGHTS_RELAY_URL }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    # Skipped jobs upstream (windy/history on most runs) would otherwise skip this.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
