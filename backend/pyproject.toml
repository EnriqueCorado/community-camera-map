[project]
name = "stanislaus-cam-map-backend"
version = "0.1.0"
description = "API serving legally-accessible public traffic cameras in Stanislaus County"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "httpx>=0.27,<0.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: calling Depends()/Response() in an argument default is the idiomatic
# FastAPI pattern, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test data tables (parametrize cases, fixtures) read better unwrapped.
"tests/*" = ["E501"]
# Mostly curated bilingual prose (sourced facts) that reads better unwrapped.
"scripts/build_alpr_access.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
