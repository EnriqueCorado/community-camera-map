[project]
name = "stanislaus-cam-map-backend"
version = "0.1.0"
description = "API serving legally-accessible public traffic cameras in Stanislaus County"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    # Security floor (Host-header and other advisories fixed in 1.3.1+).
    "starlette>=1.7,<1.8",
    "uvicorn[standard]>=0.32,<0.33",
    "httpx>=0.27,<0.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pillow>=13.0,<14",
    # Pure-Python PDF text extraction for the DOJ EOIR roster bake (no deps).
    "pypdf>=6.21.0,<7",
    # CA bundle for the one state server that omits its intermediate cert
    # (state_bakes.py); already in the tree via httpx, declared since we import it.
    "certifi>=2026.10.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.7,<0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: calling Depends()/Response() in an argument default is the idiomatic
# FastAPI pattern, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test data tables (parametrize cases, fixtures) read better unwrapped.
"tests/*" = ["E501"]
# Mostly curated bilingual prose (sourced facts) that reads better unwrapped.
"scripts/build_alpr_access.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
